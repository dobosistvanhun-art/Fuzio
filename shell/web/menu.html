<!doctype html>
<html lang="hu"><head><meta charset="utf-8"><title>Fusion Start</title><link rel="stylesheet" href="style.css"></head>
<body>
<div id="menu">
  <input id="search" placeholder="Keresés a programok között…" autocomplete="off">
  <h6>Programok</h6>
  <div id="apps"></div>
  <div id="foot"><span>fusion</span><small id="ver"></small></div>
</div>
<script>
const send = (m) => window.webkit.messageHandlers.fusion.postMessage(JSON.stringify(m));
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let apps = [];
const q = document.getElementById("search");
function shown() {
  const f = q.value.toLowerCase();
  return apps.filter(a => !f || a.name.toLowerCase().includes(f) || a.desc.toLowerCase().includes(f));
}
function render() {
  document.getElementById("apps").innerHTML = shown().map(a =>
    `<div class="app" data-id="${a.id}"><div class="ico">${esc(a.name.substring(0, 2))}</div><div><b>${esc(a.name)}</b><small>${esc(a.desc)}</small></div></div>`).join("");
}
function launch(id) { send({cmd: "launch", id}); send({cmd: "closemenu"}); }
window.fusion = {
  init(list, ver) { apps = list; document.getElementById("ver").textContent = ver; render(); },
  opened() { q.value = ""; render(); q.focus(); }
};
q.oninput = render;
q.onkeydown = (e) => {
  if (e.key === "Escape") send({cmd: "closemenu"});
  if (e.key === "Enter") { const l = shown(); if (l.length) launch(l[0].id); }
};
document.getElementById("apps").onclick = (e) => { const el = e.target.closest(".app"); if (el) launch(el.dataset.id); };
</script>
</body></html>
