# FusionOS build-konfiguráció
# A kernel a Phase 0-ban a ZBookon mért Ubuntu noble kernel.
KERNEL_ABI="6.8.0-142-generic"
KERNEL_PKG_VERSION="6.8.0-142.142"

# Csomagok, amelyeket a fetch lépés letölt (apt-get download, root nélkül).
# formátum: csomagnév=verzió  (üres verzió = a tárolóban elérhető jelölt)
FETCH_PACKAGES="
linux-image-${KERNEL_ABI}=${KERNEL_PKG_VERSION}
linux-modules-${KERNEL_ABI}=${KERNEL_PKG_VERSION}
linux-modules-extra-${KERNEL_ABI}=${KERNEL_PKG_VERSION}
busybox-static=
console-setup-linux=
"

# Tartalék forrás a rögzített verziójú csomagokhoz: ha a gazdagép apt-je nem találja
# (pl. a Mint tükre / csomaglistája nem ismeri), közvetlenül az Ubuntu archívumból
# töltjük le, és SHA256-tal ellenőrizzük.
# formátum: csomagnév|útvonal a tárolóban|sha256
UBUNTU_MIRROR="http://archive.ubuntu.com/ubuntu"
FETCH_POOL="
linux-image-${KERNEL_ABI}|pool/main/l/linux-signed/linux-image-${KERNEL_ABI}_${KERNEL_PKG_VERSION}_amd64.deb|51772494d46f23d0fad486c7bcd59e21727ec59b9b1894f9c6b4d61ca1899d3c
linux-modules-${KERNEL_ABI}|pool/main/l/linux/linux-modules-${KERNEL_ABI}_${KERNEL_PKG_VERSION}_amd64.deb|ee4feb479079151441883b451f0e627df040798c2524641486ce0a90a3811c20
linux-modules-extra-${KERNEL_ABI}|pool/main/l/linux/linux-modules-extra-${KERNEL_ABI}_${KERNEL_PKG_VERSION}_amd64.deb|2bab04acbad980eb7fe2aa6285c4ccd3dd0ec717f103e447083584a91c7dab64
"

# -----------------------------------------------------------------------------
# NVIDIA 470 legacy driver (Kepler: Quadro K1100M) — a "470-server" sorozat
#
# Ugyanaz a 470.256.02 driver, amely a ZBook Mint rendszerén bizonyítottan fut.
# FIGYELEM: a sima "nvidia-*-470" csomagok a noble-updates-ben (0ubuntu0.24.04.5)
# már csak ÁTMENETI csomagok a 535-ös driverre, az pedig nem támogatja a Keplert —
# ezeket nem használjuk. A "-470-server" sorozat valódi 470-es csomag.
# A csomagokat közvetlenül az archívumból, rögzített SHA256-tal töltjük le
# (build/cache/nvidia), a gazdagép apt-jától függetlenül.
#   - nvidia-kernel-source: ebből fordul a kernelmodul a KERNEL_ABI kernelhez
#     (eldobható build-chrootban; a rendszerképbe fordító nem kerül)
#   - a többi: a rendszerkép felhasználói része (GL/GLX/EGL/Vulkan, Xorg-driver, nvidia-smi)
# formátum: csomagnév|útvonal a tárolóban|sha256
# -----------------------------------------------------------------------------
NVIDIA_VERSION="470.256.02"
NVIDIA_PKG_VERSION="470.256.02-0ubuntu0.24.04.1"
NVIDIA_SOURCE_PKG="nvidia-kernel-source-470-server"
NVIDIA_SOURCE_DIR="nvidia-srv-470.256.02"
_NV="pool/restricted/n/nvidia-graphics-drivers-470-server"
NVIDIA_DEBS="
nvidia-kernel-source-470-server|$_NV/nvidia-kernel-source-470-server_${NVIDIA_PKG_VERSION}_amd64.deb|31c67e4a2ad62a11de44d34bcc3abf80b14d1226356d80e451e387947b05d636
nvidia-kernel-common-470-server|$_NV/nvidia-kernel-common-470-server_${NVIDIA_PKG_VERSION}_amd64.deb|137257c8de3e1b7fa0fcc83a215f98f48752b4c509c9adf31157499558d5473f
nvidia-utils-470-server|$_NV/nvidia-utils-470-server_${NVIDIA_PKG_VERSION}_amd64.deb|c4a0e9efb190de305599cbaab4dc6bb22d0062c60972a7ca84594665fb2164de
libnvidia-gl-470-server|$_NV/libnvidia-gl-470-server_${NVIDIA_PKG_VERSION}_amd64.deb|da68b8b4335c3912cd8b59313f98b1a5a1bc69e291cf84a3af5b27d3a1132aae
libnvidia-common-470-server|$_NV/libnvidia-common-470-server_${NVIDIA_PKG_VERSION}_all.deb|149f4f902f6acfa953bae22c120fb28bc8b4e6a40c65e6e0b6912d758b104320
libnvidia-compute-470-server|$_NV/libnvidia-compute-470-server_${NVIDIA_PKG_VERSION}_amd64.deb|820fc145a31e8a90446a685c0c037073892b9acd57cf2a1ec8c84cd54357f1b6
xserver-xorg-video-nvidia-470-server|$_NV/xserver-xorg-video-nvidia-470-server_${NVIDIA_PKG_VERSION}_amd64.deb|cbf65bae91951a78e049a8184a92e918a87297e5c33313495d232540a8b61382
libnvidia-cfg1-470-server|$_NV/libnvidia-cfg1-470-server_${NVIDIA_PKG_VERSION}_amd64.deb|9679c7989eb3b56d82c554735be3d492a031851e32c2c6f635db9639d8911df1
"
# a kernelmodulok (a sorrend a betöltés sorrendje; a peermem / vgpu nem kell)
NVIDIA_MODULES="nvidia nvidia-modeset nvidia-drm nvidia-uvm"

# Az initramfs kernelmoduljai (a függőségek automatikusan jönnek):
#   ahci          — SATA lemezek (VirtualBox, ZBook belső SSD)
#   xhci-pci      — USB 3 vezérlő (a ZBook USB 3 portjai; nélküle nincs USB-eszköz!)
#   usb-storage, uas — USB pendrive
#   usbhid, hid-generic — USB billentyűzet
DIAG_MODULES="ahci xhci-pci usb-storage uas usbhid hid-generic"
# a FusionOS initramfs ezen felül: EROFS (rendszerkép) és overlay (/etc, /var)
FUSION_MODULES="$DIAG_MODULES erofs overlay"

# A rendszerképbe a linux-modules-extra csomagból csak ezek a modulok kerülnek
# (a függőségeikkel együtt) — a teljes csomag ~110 MB lenne.
#   usbserial, ch341 (CH340 — lézer), cp210x (CP2102 — Klipper MCU), ftdi_sio (FTDI),
#   pl2303 (Prolific), cdc-acm (natív USB-s vezérlők, pl. Klipper/STM32)
EXTRA_MODULES="usbserial ch341 cp210x ftdi_sio pl2303 cdc-acm"

# Konzol betűkészlet (magyar ékezetekhez, pl. ő, ű)
CONSOLE_FONT="Uni2-Terminus16.psf.gz"

# Kernel parancssor (a slotot — fusion.slot=A|B — a build teszi hozzá)
#   FusionOS:      a slot rendszerképe, systemd
#   diagnosztika:  az M0 ellenőrző képernyő (hardver, partíciók), nem ír semmit
CMDLINE_RELEASE="fbcon=nodefer console=tty0 loglevel=3 systemd.show_status=auto"
CMDLINE_TEST="fbcon=nodefer console=tty0 console=ttyS0,115200 loglevel=4 fusion.test"
CMDLINE_DIAG="fbcon=nodefer console=tty0 loglevel=3 fusion.m0"
CMDLINE_DIAG_TEST="fbcon=nodefer console=tty0 console=ttyS0,115200 loglevel=4 fusion.m0 fusion.test fusion.test.hold=8"

# Fejlesztői mérési bejegyzések a boot menüben — így a kernel parancssorát nem kell
# kézzel szerkeszteni (a boot menü szerkesztője UEFI alatt amerikai kiosztású).
# Mind az A slot UKI-ját indítja, a szokásos parancssor végére fűzött elemekkel.
# formátum: azonosító|menücím|a parancssorhoz fűzött elemek
BOOT_MEASURE_ENTRIES="
fusion-meres-kms-ki|FusionOS — mérés: KMS nélkül (nvidia-drm.modeset=0)|nvidia-drm.modeset=0
fusion-meres-xorg-root|FusionOS — tartalék: Xorg root-joggal|fusion.xorg.root=yes
fusion-konzol|FusionOS — szöveges konzol (Desktop nélkül)|fusion.desktop=0
"

# -----------------------------------------------------------------------------
# Fusion Windows Runtime: Wine, forrásból, új WoW64 módban (build/steps/wine.sh)
# A stabil ág 11.0-s kiadása (a "stable" ág is erre a commitra mutat, 2026-09-27).
# A forrás a GitHub-os tükörből jön; a commit azonosítója ellenőrzi a tartalmat.
# Fusion-javítások: fusionos/fwr/wine-patches/*.patch
# -----------------------------------------------------------------------------
WINE_VERSION="11.0"
WINE_REF="wine-11.0"
WINE_COMMIT="db11d0fe6a169c457e23d007e20404643d067aa8"
WINE_GIT="https://github.com/wine-mirror/wine.git"
