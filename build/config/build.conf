# FusionOS build-konfiguráció (M0)
# A kernel a Phase 0-ban a ZBookon mért Ubuntu noble kernel.
KERNEL_ABI="6.8.0-142-generic"
KERNEL_PKG_VERSION="6.8.0-142.142"

# Csomagok, amelyeket a fetch lépés letölt (apt-get download, root nélkül).
# formátum: csomagnév=verzió  (üres verzió = a tárolóban elérhető jelölt)
FETCH_PACKAGES="
linux-image-${KERNEL_ABI}=${KERNEL_PKG_VERSION}
linux-modules-${KERNEL_ABI}=${KERNEL_PKG_VERSION}
busybox-static=
console-setup-linux=
"

# Az initramfs kernelmoduljai (a függőségek automatikusan jönnek):
#   ahci          — SATA lemezek (VirtualBox, ZBook belső SSD)
#   xhci-pci      — USB 3 vezérlő (a ZBook USB 3 portjai; nélküle nincs USB-eszköz!)
#   usb-storage, uas — USB pendrive
#   usbhid, hid-generic — USB billentyűzet
DIAG_MODULES="ahci xhci-pci usb-storage uas usbhid hid-generic"
# a FusionOS initramfs ezen felül: EROFS (rendszerkép) és overlay (/etc, /var)
FUSION_MODULES="$DIAG_MODULES erofs overlay"

# Konzol betűkészlet (magyar ékezetekhez, pl. ő, ű)
CONSOLE_FONT="Uni2-Terminus16.psf.gz"

# Kernel parancssor (a slotot — fusion.slot=A|B — a build teszi hozzá)
#   FusionOS:      a slot rendszerképe, systemd
#   diagnosztika:  az M0 ellenőrző képernyő (hardver, partíciók), nem ír semmit
CMDLINE_RELEASE="fbcon=nodefer console=tty0 loglevel=3 systemd.show_status=auto"
CMDLINE_TEST="fbcon=nodefer console=tty0 console=ttyS0,115200 loglevel=4 fusion.test"
CMDLINE_DIAG="fbcon=nodefer console=tty0 loglevel=3 fusion.m0"
CMDLINE_DIAG_TEST="fbcon=nodefer console=tty0 console=ttyS0,115200 loglevel=4 fusion.m0 fusion.test fusion.test.hold=8"
