# Fusion Hardware Layer — a kijelződriverek automatikus betöltésének tiltása.
# A grafikus drivert nem az udev tölti be, hanem a Fusion Hardware Layer
# (fusion-hardware.service) a kiválasztott hardverprofil alapján
# (display.kernel_modules). A "blacklist" csak az automatikus betöltést tiltja,
# a kifejezett modprobe továbbra is működik.
blacklist nouveau
blacklist nvidiafb
blacklist i915
blacklist vmwgfx
blacklist vboxvideo
blacklist bochs
blacklist cirrus
blacklist qxl
blacklist virtio_gpu
blacklist amdgpu
blacklist radeon
blacklist nvidia
blacklist nvidia_drm
blacklist nvidia_modeset
blacklist nvidia_uvm
