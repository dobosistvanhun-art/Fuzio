# Fúzió — touchpad alapértékek (libinput): koppintás = kattintás, két ujjal görgetés, gépelés közben tiltva.
# A felhasználó választása (Beállítások → Eszközök → Touchpad, fusion-touchpad) a munkamenet indulásakor erre kerül.
Section "InputClass"
    Identifier "fusion-touchpad"
    MatchIsTouchpad "on"
    MatchDriver "libinput"
    Option "Tapping" "on"
    Option "TappingButtonMap" "lrm"
    Option "ScrollMethod" "twofinger"
    Option "HorizontalScrolling" "on"
    Option "NaturalScrolling" "off"
    Option "DisableWhileTyping" "on"
EndSection
