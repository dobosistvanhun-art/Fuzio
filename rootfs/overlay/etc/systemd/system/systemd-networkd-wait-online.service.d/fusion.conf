# Fúzió — elég, ha EGY kapcsolat él (Wi-Fi vagy kábel): a ZBook kihúzott kábelű vezetékes portja ne tartsa
# fel 2 percig az indulást, és hálózat nélkül (pl. a műhelyben) se legyen „hibás szolgáltatás”.
[Service]
ExecStart=
ExecStart=-/usr/lib/systemd/systemd-networkd-wait-online --any --timeout=30
