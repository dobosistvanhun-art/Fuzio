# Fúzió — SSH-szerver (0.0.78, Beállítások → Távoli elérés). Alapból ki van kapcsolva.
# Csak kulccsal (jelszóval nem: a fusion felhasználó gyári jelszava ismert), root nem léphet be, csak
# rendszergazda (sudo csoport), és csak a Tailscale-hálózat (100.64.0.0/10, fd7a:115c:a1e0::/48) vagy maga a
# gép felől. Az első érvényes érték számít: ez a fájl az Ubuntu sshd_config-ja előtt olvasódik be.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
PermitRootLogin no
PubkeyAuthentication yes
AuthenticationMethods publickey
AllowGroups sudo
AllowUsers *@100.64.0.0/10 *@fd7a:115c:a1e0::/48 *@127.0.0.1 *@::1
X11Forwarding no
MaxAuthTries 3
LoginGraceTime 30
