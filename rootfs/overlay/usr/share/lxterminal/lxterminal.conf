# Fúzió — a Terminál (LXTerminal) rendszerszintű beállítása: a Fusion sötét színei
# (a felhasználó saját beállítása: ~/.config/lxterminal/lxterminal.conf — a Terminál → Beállítások menüből)
[general]
fontname=DejaVu Sans Mono 11
selchars=-A-Za-z0-9,./?%&#:_~
scrollback=5000
bgcolor=rgb(13,17,23)
fgcolor=rgb(230,237,243)
palette_color_0=rgb(72,79,88)
palette_color_1=rgb(255,123,114)
palette_color_2=rgb(63,185,80)
palette_color_3=rgb(210,153,34)
palette_color_4=rgb(88,166,255)
palette_color_5=rgb(188,140,255)
palette_color_6=rgb(57,197,207)
palette_color_7=rgb(177,186,196)
palette_color_8=rgb(110,118,129)
palette_color_9=rgb(255,161,152)
palette_color_10=rgb(86,211,100)
palette_color_11=rgb(227,179,65)
palette_color_12=rgb(121,192,255)
palette_color_13=rgb(210,168,255)
palette_color_14=rgb(86,212,221)
palette_color_15=rgb(240,246,252)
color_preset=Custom
disallowbold=false
boldbright=false
cursorblinks=true
cursorunderline=false
audiblebell=false
visualbell=false
tabpos=top
geometry_columns=100
geometry_rows=30
hidescrollbar=false
hidemenubar=false
hideclosebutton=false
hidepointer=false
disablef10=true
disablealt=false
disableconfirm=false
