# FusionOS: a /data-t a fusion-init csatolja az initramfs-ben, és rajta van a
# gyökér-overlay írható rétege. A systemd ne válassza le a leállítás elején
# (umount.target) — a legvégén a systemd-shutdown csak olvashatóra állítja,
# amikor már semmilyen folyamat nem fut, így a DATA fájlrendszer tisztán zárul le.
[Unit]
DefaultDependencies=no
