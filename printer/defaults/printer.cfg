# FusionOS — alapértelmezett nyomtató-konfiguráció (Anycubic 4Max, ATmega2560, Klipper)
# Forrás: a Minten futó printer.cfg (2026-09-29), a FusionOS útvonalaira átírva:
#   [mcu] serial -> /dev/fusion/printer (M3 eszközréteg, CP2102)
#   [virtual_sdcard] path -> /data/printer/gcodes
# Másik konfiguráció átvétele: sudo fusion-printer import <printer.cfg>

[include mainsail.cfg]
[mcu]
serial: /dev/fusion/printer

[virtual_sdcard]
path: /data/printer/gcodes
on_error_gcode: CANCEL_PRINT

[stepper_x]
step_pin: PF0
dir_pin: PF1
enable_pin: !PD7
microsteps: 16
rotation_distance: 40
endstop_pin: ^!PE5
position_min: -2
position_endstop: -2
position_max: 215
homing_speed: 60.0

[stepper_y]
step_pin: PF6
dir_pin: PF7
enable_pin: !PF2
microsteps: 16
rotation_distance: 40
endstop_pin: ^!PJ1
position_endstop: 0
position_min: -2
position_max: 215
homing_speed: 60.0

[stepper_z]
step_pin: PL3
dir_pin: PL1
enable_pin: !PK0
microsteps: 16
rotation_distance: 8
endstop_pin: ^!PD3
position_endstop: 0
position_min: -2
position_max: 295
homing_speed: 8.0
homing_retract_dist: 3.0


[extruder]
step_pin: PA4
dir_pin: PA6
enable_pin: !PA2
microsteps: 16
rotation_distance: 33.133
nozzle_diameter: 0.400
filament_diameter: 1.750
max_extrude_only_distance: 60
max_extrude_cross_section: 5.0
heater_pin: PB4
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PK5
pressure_advance: 0.05
#control: pid
#pid_kp: 27.725
#pid_ki: 1.224
#pid_kd: 156.991
max_power: 1.0
min_temp: 10
max_temp: 300

[heater_bed]
heater_pin: PH5
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PK6
#control: pid
#pid_kp: 73.735
#pid_ki: 1.437
#pid_kd: 945.653
max_power: 1.0
min_temp: 10
max_temp: 115

[fan]
pin: PH6
kick_start_time: 1.0

[verify_heater extruder]
max_error: 200
check_gain_time: 80
hysteresis: 7
heating_gain: 1



[printer]
kinematics: cartesian
max_velocity: 250
max_accel: 1800
max_z_velocity: 8
max_z_accel: 60

[heater_fan extruder_fan]
pin: PL5

[heater_fan stepstick_fan]
pin: PH4
kick_start_time: 1.0

[display]
lcd_type: st7920
cs_pin: PH1
sclk_pin: PA1
sid_pin: PH0
encoder_pins: ^PC6, ^PC4
click_pin: ^!PC2
kill_pin: ^!PG0

[filament_switch_sensor e0_sensor]
switch_pin: PD2
pause_on_runout: True
runout_gcode: M600

[bed_mesh]
speed: 120
horizontal_move_z: 5
mesh_min: 20, 20
mesh_max: 200, 200
probe_count: 5, 5
algorithm: lagrange
fade_start: 1.0
fade_end: 10.0

[bed_screws]
screw1: 5,5
screw2: 205,5
screw3: 205,205
screw4: 5,205

[gcode_arcs]
 resolution: 0.1

[gcode_macro FILAMENT_DRYING]
description: Filament szárítása az asztalon
gcode:
    {% set target_temp = params.TEMP|default(50)|float %}
    {% set hours = params.HOURS|default(6)|float %}
    {% set seconds = hours * 3600 %}
    
    M118 Szárítás indítása: {target_temp}C, {hours} órán át.
    SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={target_temp}
    SET_IDLE_TIMEOUT TIMEOUT={seconds}
    # Opcionálisan: G28 # Home, ha akarod, hogy a fej ne útban legyen



[gcode_macro RESUME]
rename_existing: BASE_RESUME
gcode:
    RESTORE_GCODE_STATE NAME=PAUSE_state
    G91
    G1 E2 F300   ; unretract
    G90
    BASE_RESUME

[gcode_macro CANCEL_PRINT]
rename_existing: BASE_CANCEL_PRINT
gcode:
    TURN_OFF_HEATERS
    CLEAR_PAUSE
    SDCARD_RESET_FILE
    BASE_CANCEL_PRINT

[gcode_macro UNLOAD_FILAMENT]
description: Manual filament unload
gcode:
    SAVE_GCODE_STATE NAME=unload_state

    M117 Filament kiadas...

    G91
    G1 E-2 F1800      ; visszahúzás (kicsit)
    G1 E-50 F3000     ; kiadás (kihúzás)

    G90

    M117 Filament kiadva

    RESTORE_GCODE_STATE NAME=unload_state

[gcode_macro LOAD_FILAMENT]
description: Manual filament load
gcode:
    SAVE_GCODE_STATE NAME=load_state

    M117 Filament betoltes...

    G91
    G1 E40 F1200      ; betoltes (csőbe)
    G1 E20 F300       ; finom betolás (nozzle-ig)

    G90

    M117 Kész

    RESTORE_GCODE_STATE NAME=load_state

[gcode_macro M600]
gcode:
    PAUSE                # Meghívja a szünetet

[gcode_macro PAUSE]
rename_existing: BASE_PAUSE
gcode:
    SAVE_GCODE_STATE NAME=PAUSE_state
    BASE_PAUSE           # A Klipper gyári szüneteltetése
    G91
    G1 E-2 F2700        # Visszahúzás
    G1 Z10 F3000        # Fej emelése
    G90
    G1 X5 Y190 F6000    # Parkolás hátulra (4Max-nál ez jó hely)

[gcode_macro _CLIENT_VARIABLE]
 variable_use_custom_pos   : True  ; Egyéni parkolási pozíció bekapcsolása
 variable_custom_park_x    : 5.0   ; X parkolási pozíció (bal szél)
 variable_custom_park_y    : 190.0 ; Y parkolási pozíció (hátra)
 variable_custom_park_dz   : 10.0  ; Mennyit emeljen a Z tengelyen (relatív)
 variable_retract          : 2.0   ; Visszahúzás hossza (mm) szünetnél
 variable_unretract        : 2.0   ; Visszatolás hossza (mm) folytatáskor
 gcode:

[gcode_macro MANUAL_LEVELING]
description: Kezi szintezes inditasa felfutessel
gcode:
   
    G28                      # Minden tengely hazakuldese
    M117 Szintezes indul!
    BED_SCREWS_ADJUST        # Elinditja a Klipper beepitett folyamatat

[gcode_macro START_PRINT]
gcode:
    M117 Melegites...
    M140 S{params.BED}
    M104 S{params.HOTEND}
    M190 S{params.BED}
    M109 S{params.HOTEND}

    G90
    M83
    G28
    
    BED_MESH_PROFILE LOAD=default
   
    G1 X5 Y5 F5000 ; Beáll a sarokba a kezdéshez
    
    M117 Tisztito vonal...
    G92 E0 ; Extruder nullázás
    G1 Y100 E10 F1000 ; Első vonal
    G92 E0
    G1 X5.5 F5000 ; Arrébb lép
    G1 Y10 E10 F1000 ; Második vonal vissza
    
    ; --- EXTRA EXTRUDÁLÁS A VÉGÉN ---
    G92 E0
    G1 E2 F300 ; Extrudál 2mm anyagot lassan (5mm/s) a vonal végén
    G4 P500    ; Várunk fél másodpercet (500ms), hogy odatapadjon
    G92 E0
    ; --------------------------------

    G1 Z1.0 F3000 ; Fej megemelése
    M117 Nyomtatas inditva...

[gcode_macro END_PRINT]
gcode:
    M117 End printing.
    G91 ; relative positioning
    G1 E-1 F300 ;retract the filament a bit before lifting the nozzle to release some of the pressure
    G1 Z+5 E-2 F1000 ;move Z up a bit and extract a bit more
    G90 ; absolute positioning
    G1 X0 F2000 ; move X to min endstops so the head is out of the way
    G1 Y200 F2000 ; Move Y to the back
    m104 S0 ; turn hotend heating off
    M140 S0 ; turn bed heating off
    M107 ; turn fan off
    M84 ; steppers off

