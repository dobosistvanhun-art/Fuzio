# FusionOS — a nyomtató webes felülete
#   http://<gép>/     Fluidd
#   http://<gép>:81/  Mainsail
# mindkettő a Moonrakerhez (127.0.0.1:7125) kapcsolódik
# (egyelőre csak IPv4: IPv6 nélküli rendszeren az nginx a [::] címmel nem indulna)

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream fusion_moonraker {
    server 127.0.0.1:7125;
}

server {
    listen 80 default_server;
    access_log off;
    root /usr/share/fusion/web/fluidd;
    index index.html;
    server_name _;
    client_max_body_size 0;
    proxy_request_buffering off;
    include /etc/nginx/snippets/fusion-moonraker.conf;
}

server {
    listen 81;
    access_log off;
    root /usr/share/fusion/web/mainsail;
    index index.html;
    server_name _;
    client_max_body_size 0;
    proxy_request_buffering off;
    include /etc/nginx/snippets/fusion-moonraker.conf;
}
